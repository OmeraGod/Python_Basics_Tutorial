name: Render Blender Solar Eclipse

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt-blender-eclipse
    paths:
      - 'blender/**'
      - '.github/workflows/render-eclipse.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Render scene
        run: |
          mkdir -p out
          blender --background --python blender/eclipse_scene.py

      - name: Show outputs
        run: |
          ls -lh out

      - name: Upload render artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solar-eclipse-blender-output
          path: |
            out/solar_eclipse.blend
            out/solar_eclipse.mp4
          if-no-files-found: error
          retention-days: 7
