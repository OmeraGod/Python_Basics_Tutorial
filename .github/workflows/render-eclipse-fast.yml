name: Render Fast Blender Eclipse
on:
  push:
    branches: [chatgpt-blender-eclipse]
    paths: ['.github/workflows/render-eclipse-fast.yml']
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender headless
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libegl-mesa0 libgl1 libglx-mesa0 xvfb ffmpeg
      - name: Render
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p out_fast
          set -o pipefail
          xvfb-run -a blender --background --python blender/eclipse_fast.py 2>&1 | tee blender_fast.log
          test -s out_fast/solar_eclipse_blender.blend
          test -s out_fast/solar_eclipse_blender.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out_fast/solar_eclipse_blender.mp4
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: blender-eclipse-fast
          path: out_fast/
          retention-days: 7
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f out_fast/solar_eclipse_blender.blend out_fast/solar_eclipse_blender.mp4
          git commit -m 'Add fast Blender eclipse render' || true
          git push origin HEAD:chatgpt-blender-eclipse