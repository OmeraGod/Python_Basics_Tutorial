name: Render Blender Solar Eclipse v3

on:
  push:
    branches:
      - chatgpt-blender-eclipse
    paths:
      - '.github/workflows/render-eclipse-v3.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender and headless graphics
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libegl-mesa0 libgl1 libglx-mesa0 mesa-utils xvfb ffmpeg
          blender --version

      - name: Render eclipse in Blender
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p out
          set -o pipefail
          xvfb-run -a blender --background --python blender/eclipse_scene_v2.py 2>&1 | tee blender.log
          test -s out/solar_eclipse.blend
          test -s out/solar_eclipse.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out/solar_eclipse.mp4
          ls -lh out

      - name: Upload Blender outputs
        uses: actions/upload-artifact@v4
        with:
          name: solar-eclipse-blender-output-v3
          path: |
            out/solar_eclipse.blend
            out/solar_eclipse.mp4
            blender.log
          if-no-files-found: error
          retention-days: 7

      - name: Commit rendered files to render branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f out/solar_eclipse.blend out/solar_eclipse.mp4
          git commit -m 'Add Blender-rendered solar eclipse outputs' || true
          git push origin HEAD:chatgpt-blender-eclipse
